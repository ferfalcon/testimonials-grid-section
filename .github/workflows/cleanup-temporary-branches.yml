name: Cleanup temporary branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-temporary-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged and temporary branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branches = [
              'design/initial-ui',
              'STOP2',
              'STOP3',
              'STOP4',
              'STOP-BRANCH-MISTAKE',
              '__do-not-create__',
              'do-not-use-this-test',
              'noop-ignore',
              'noop-ignore-2',
              'noop-ignore-3',
              'tmp-no-op-avoid',
              'tmp-stop',
              'tmp-tree-safe',
              'tmp-tree-test-not-ref'
            ];

            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.warning(`Skipped ${branch}: ${error.message}`);
                  continue;
                }
                throw error;
              }
            }
