name: Record Workpack implementation outcome

on:
  push:
    branches:
      - design/initial-ui
    paths:
      - '.github/workflows/record-workpack-outcome.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: design/initial-ui
      - name: Record implementation narrative
        env:
          SECTION_B64: ''
        run: |
          python -c "import os,base64; from pathlib import Path; p=Path('WORKPACK.md'); t=p.read_text(); s=t.index('## 11. Implementation narrative'); e=t.index('## 13. Final implementation review'); sec=base64.b64decode(os.environ['SECTION_B64']).decode(); p.write_text(t[:s]+sec+t[e:])"
      - name: Commit narrative and remove one-time workflow
        run: |
          rm .github/workflows/record-workpack-outcome.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORKPACK.md .github/workflows/record-workpack-outcome.yml
          git commit -m 'docs: record implementation outcome'
          git push origin HEAD:design/initial-ui
