name: Materialize implementation dependencies

on:
  push:
    branches:
      - design/initial-ui
    paths:
      - 'package.json'
      - '.github/workflows/materialize-implementation.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Generate the pinned npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Materialize Barlow Semi Condensed 500 and 600
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/fonts
          curl --fail --location --retry 3 \
            'https://fonts.gstatic.com/s/barlowsemicondensed/v15/wlpigxjLBV1hqnzfr-F8sEYMB0Yybp0mudRfi6mPAGEki52WfA.ttf' \
            --output public/assets/fonts/BarlowSemiCondensed-Medium.ttf
          curl --fail --location --retry 3 \
            'https://fonts.gstatic.com/s/barlowsemicondensed/v15/wlpigxjLBV1hqnzfr-F8sEYMB0Yybp0mudRfp66PAGEki52WfA.ttf' \
            --output public/assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/barlowsemicondensed/OFL.txt' \
            --output public/assets/fonts/OFL.txt
          test "$(stat -c%s public/assets/fonts/BarlowSemiCondensed-Medium.ttf)" -gt 50000
          test "$(stat -c%s public/assets/fonts/BarlowSemiCondensed-SemiBold.ttf)" -gt 50000
          sha256sum public/assets/fonts/BarlowSemiCondensed-*.ttf
      - name: Commit deterministic generated inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-implementation.yml
          git add package-lock.json public/assets/fonts
          git commit -m 'chore: materialize lockfile and local fonts'
          git push origin HEAD:${GITHUB_REF_NAME}
